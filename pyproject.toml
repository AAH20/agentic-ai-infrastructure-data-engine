[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-infrastructure-data-engine"
version = "0.1.0"
description = "Infrastructure operations trajectory, evaluation and KPI engine"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
infra-data-engine = "infra_data_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
